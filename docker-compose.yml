# Ambiente de desenvolvimento: sobe banco, API, front e nginx com um comando.
#   cp .env.example .env && docker compose up --build
# Acesso: http://localhost:8080  (API em /api/, docs em /api/docs/)
# O front e construido a partir do repositorio ui-gestprev (UI_PATH no .env).

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/saude/', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ui:
    build: ${UI_PATH:-../ui-gestprev}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      ui:
        condition: service_healthy

volumes:
  pgdata:
